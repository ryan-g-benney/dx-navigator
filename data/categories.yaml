# Aetiological hierarchy. A DAG, not a tree — pulmonary embolism reaches both
# vascular and respiratory. First parent listed on a condition is the primary
# one, used for breadcrumbs; the rest are for inference and display.
categories:
  respiratory:      {name: "Respiratory"}
  cardiovascular:   {name: "Cardiovascular"}
  gastrointestinal: {name: "Gastrointestinal"}
  iatrogenic:       {name: "Iatrogenic"}

  respiratory-infection:       {name: "Respiratory tract infection", parents: [respiratory]}
  upper-respiratory-infection: {name: "Upper respiratory tract infection", parents: [respiratory-infection]}
  lower-respiratory-infection: {name: "Lower respiratory tract infection", parents: [respiratory-infection]}
  airways-disease:             {name: "Chronic airways disease", parents: [respiratory]}
  respiratory-malignancy:      {name: "Respiratory malignancy", parents: [respiratory]}
  upper-airway:                {name: "Upper airway", parents: [respiratory]}
  cardiac:                     {name: "Cardiac", parents: [cardiovascular]}
  vascular:                    {name: "Vascular", parents: [cardiovascular]}
  musculoskeletal:  {name: "Musculoskeletal"}
  neurological:     {name: "Neurological"}
  psychological:    {name: "Psychological"}
  infection:        {name: "Infection"}

  coronary:              {name: "Coronary artery disease", parents: [cardiac]}
  pericardial:           {name: "Pericardial", parents: [cardiac]}
  aortic:                {name: "Aortic", parents: [vascular]}
  pleural:               {name: "Pleural", parents: [respiratory]}
  oesophageal:           {name: "Oesophageal", parents: [gastrointestinal]}
  chest-wall:            {name: "Chest wall", parents: [musculoskeletal]}
  primary-headache:      {name: "Primary headache", parents: [neurological]}
  secondary-headache:    {name: "Secondary headache", parents: [neurological]}
  intracranial-vascular: {name: "Intracranial vascular", parents: [neurological, vascular]}
  cns-infection:         {name: "CNS infection", parents: [neurological, infection]}
  cns-malignancy:        {name: "CNS malignancy", parents: [neurological]}
  vasculitis:            {name: "Vasculitis", parents: [vascular]}
  ophthalmic:      {name: "Ophthalmic"}
  toxic:           {name: "Toxic and environmental"}
  haematological:  {name: "Haematological"}
  arrhythmia:      {name: "Arrhythmia", parents: [cardiac]}
  cranial-nerve:   {name: "Cranial nerve", parents: [neurological]}
  functional:      {name: "Functional", parents: [psychological]}
  gastric:         {name: "Gastric and duodenal", parents: [gastrointestinal]}
  airways-structural: {name: "Structural airways disease", parents: [respiratory]}

