# Headache -- NICE rules.
#
# GENERATED by scripts/build_rules_headache.py. Do not hand-edit text_verbatim.
#
# GAPS, recorded rather than papered over:
#  - No current NICE guideline covers subarachnoid haemorrhage recognition in
#    primary care. The condition is pooled with red-flag features but no rule
#    fires for it.
#  - Giant cell arteritis likewise has no NICE recognition guideline; the
#    same-day-referral convention is clinical practice, not NICE, so it is not
#    encoded as a rule here.
# Both are the strongest argument in the KB for a clinician review pass.

sources:
  ng12_hd:
    type: guideline
    title: "Suspected cancer: recognition and referral"
    url: https://www.nice.org.uk/guidance/ng12
    licence: https://www.nice.org.uk/reusing-our-content/nice-uk-open-content-licence
    attribution: "(c) NICE 2015 Suspected cancer: recognition and referral. Available from https://www.nice.org.uk/guidance/ng12 All rights reserved. Subject to Notice of rights."
  ng240:
    type: guideline
    title: "Meningitis (bacterial) and meningococcal disease: recognition, diagnosis and management"
    url: https://www.nice.org.uk/guidance/ng240
    licence: https://www.nice.org.uk/reusing-our-content/nice-uk-open-content-licence
    attribution: "(c) NICE 2024 Meningitis (bacterial) and meningococcal disease: recognition, diagnosis and management. Available from https://www.nice.org.uk/guidance/ng240 All rights reserved. Subject to Notice of rights."

rules:
  # NG240 1.1.4 is an all-of: the red flag combination requires every symptom.
  ng240-meningitis-red-flag-1.1.4:
    complaints: [headache]
    all_of:
      - {var: fever_history, op: "==", value: present}
      - {var: neck_stiffness, op: "==", value: present}
      - {var: confusion_new, op: "==", value: present}
    emit:
      kind: escalation
      urgency: emergency
      text_verbatim: "Strongly suspect bacterial meningitis in people with all the symptoms in the red flag combination: fever headache neck stiffness altered level of consciousness or cognition (including confusion or delirium)."
      source: ng240

  ng240-meningococcal-red-flag-1.1.9:
    complaints: [headache]
    min_matches: 1
    any_of:
      - {var: non_blanching_rash, op: "==", value: present}
    emit:
      kind: escalation
      urgency: emergency
      text_verbatim: "Strongly suspect meningococcal disease in people with any of these red flag symptoms: haemorrhagic, non-blanching rash with lesions larger than 2 mm (purpura) rapidly progressive and/or spreading non-blanching petechial or purpuric rash any symptoms and signs of bacterial meningitis (see tables 1 and 2 ), when combined with a non-blanching petechial or purpuric rash."
      source: ng240

  ng12-cns-cancer-1.9.1:
    complaints: [headache]
    min_matches: 1
    any_of:
      - {var: focal_neurology, op: "==", value: present}
      - {var: worse_on_waking, op: "==", value: present}
    emit:
      kind: investigation
      urgency: urgent
      text_verbatim: "Consider an urgent , direct access , MRI scan of the brain (or CT scan if MRI is contraindicated) to assess for brain or central nervous system cancer in adults with progressive, sub‑acute loss of central neurological function."
      source: ng12_hd
