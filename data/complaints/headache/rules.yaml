# Headache -- NICE rules.
#
# GENERATED by scripts/build_rules_headache.py. Do not hand-edit text_verbatim.
#
# GAP, narrowed but not closed:
#  CG150 1.1.1 is the only NICE recommendation that names sudden-onset headache
#  and giant cell arteritis, so it is what the SAH and GCA paths now fire on.
#  Its verb is "evaluate ... and consider the need for further investigations
#  and/or referral" -- urgent, not emergency. The immediate-admission convention
#  for thunderclap headache and the same-day-referral convention for GCA are
#  clinical practice, not NICE, and are still unencoded. A clinician review pass
#  has to decide whether the tool may assert an urgency NICE does not state.

sources:
  cg150:
    type: guideline
    title: "Headaches in over 12s: diagnosis and management"
    url: https://www.nice.org.uk/guidance/cg150
    licence: https://www.nice.org.uk/reusing-our-content/nice-uk-open-content-licence
    attribution: "(c) NICE 2021 Headaches in over 12s: diagnosis and management. Available from https://www.nice.org.uk/guidance/cg150 All rights reserved. Subject to Notice of rights."
  ng12_hd:
    type: guideline
    title: "Suspected cancer: recognition and referral"
    url: https://www.nice.org.uk/guidance/ng12
    licence: https://www.nice.org.uk/reusing-our-content/nice-uk-open-content-licence
    attribution: "(c) NICE 2015 Suspected cancer: recognition and referral. Available from https://www.nice.org.uk/guidance/ng12 All rights reserved. Subject to Notice of rights."
  ng240:
    type: guideline
    title: "Meningitis (bacterial) and meningococcal disease: recognition, diagnosis and management"
    url: https://www.nice.org.uk/guidance/ng240
    licence: https://www.nice.org.uk/reusing-our-content/nice-uk-open-content-licence
    attribution: "(c) NICE 2024 Meningitis (bacterial) and meningococcal disease: recognition, diagnosis and management. Available from https://www.nice.org.uk/guidance/ng240 All rights reserved. Subject to Notice of rights."

rules:
  # CG150 1.1.1 is a long any-of list. Only the features the KB already has a
  # variable for are encoded; the rest of the list stays in the quoted text.
  cg150-headache-evaluate-1.1.1:
    complaints: [headache]
    min_matches: 1
    any_of:
      - {var: headache_onset, op: in, value: [instant_maximal, minutes]}
      - {var: focal_neurology, op: "==", value: present}
      - {var: confusion_new, op: "==", value: present}
      - {var: scalp_tenderness, op: "==", value: present}
      - {var: jaw_claudication, op: "==", value: present}
      - {var: eye_pain_red_eye, op: "==", value: present}
    emit:
      kind: investigation
      urgency: urgent
      text_verbatim: "Evaluate people who present with headache and any of the following features, and consider the need for further investigations and/or referral: worsening headache with fever sudden‑onset headache reaching maximum intensity within 5 minutes new‑onset neurological deficit new‑onset cognitive dysfunction change in personality impaired level of consciousness recent (typically within the past 3 months) head trauma headache triggered by cough, valsalva (trying to breathe out with nose and mouth blocked) or sneeze headache triggered by exercise orthostatic headache (headache that changes with posture) symptoms suggestive of giant cell arteritis symptoms and signs of acute narrow angle glaucoma a substantial change in the characteristics of their headache."
      source: cg150

  # NG240 1.1.4 is an all-of: the red flag combination requires every symptom.
  ng240-meningitis-red-flag-1.1.4:
    complaints: [headache]
    all_of:
      - {var: fever_history, op: "==", value: present}
      - {var: neck_stiffness, op: "==", value: present}
      - {var: confusion_new, op: "==", value: present}
    emit:
      kind: escalation
      urgency: emergency
      text_verbatim: "Strongly suspect bacterial meningitis in people with all the symptoms in the red flag combination: fever headache neck stiffness altered level of consciousness or cognition (including confusion or delirium)."
      source: ng240

  ng240-meningococcal-red-flag-1.1.9:
    complaints: [headache]
    min_matches: 1
    any_of:
      - {var: non_blanching_rash, op: "==", value: present}
    emit:
      kind: escalation
      urgency: emergency
      text_verbatim: "Strongly suspect meningococcal disease in people with any of these red flag symptoms: haemorrhagic, non-blanching rash with lesions larger than 2 mm (purpura) rapidly progressive and/or spreading non-blanching petechial or purpuric rash any symptoms and signs of bacterial meningitis (see tables 1 and 2 ), when combined with a non-blanching petechial or purpuric rash."
      source: ng240

  ng12-cns-cancer-1.9.1:
    complaints: [headache]
    min_matches: 1
    any_of:
      - {var: focal_neurology, op: "==", value: present}
      - {var: worse_on_waking, op: "==", value: present}
    emit:
      kind: investigation
      urgency: urgent
      text_verbatim: "Consider an urgent , direct access , MRI scan of the brain (or CT scan if MRI is contraindicated) to assess for brain or central nervous system cancer in adults with progressive, sub‑acute loss of central neurological function."
      source: ng12_hd
