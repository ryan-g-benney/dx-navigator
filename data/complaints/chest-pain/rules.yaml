# Chest pain -- NICE rules.
#
# GENERATED by scripts/build_rules_chest_pain.py. Do not hand-edit
# text_verbatim; re-run the builder.
#
# GAP: no NICE guideline covers aortic dissection recognition in primary care.
# The condition is in the pool and carries red-flag features, but no rule fires
# for it. Recorded rather than papered over.

sources:
  cg95:
    type: guideline
    title: "Recent-onset chest pain of suspected cardiac origin: assessment and diagnosis"
    url: https://www.nice.org.uk/guidance/cg95
    licence: https://www.nice.org.uk/reusing-our-content/nice-uk-open-content-licence
    attribution: "(c) NICE 2016 Recent-onset chest pain of suspected cardiac origin: assessment and diagnosis. Available from https://www.nice.org.uk/guidance/cg95 All rights reserved. Subject to Notice of rights."

rules:
  cg95-acs-symptoms-1.2.1.3:
    complaints: [chest-pain]
    min_matches: 1
    any_of:
      - {var: chest_pain_duration, op: in, value: [over_15_minutes, constant]}
      - {var: autonomic_symptoms, op: "==", value: present}
      - {var: chest_pain_radiation, op: "==", value: arm_jaw_or_neck}
    emit:
      kind: must_ask
      urgency: same_day
      text_verbatim: "Initially assess people for any of the following symptoms, which may indicate an ACS: pain in the chest and/or other areas (for example, the arms, back or jaw) lasting longer than 15 minutes chest pain associated with nausea and vomiting, marked sweating, breathlessness, or particularly a combination of these chest pain associated with haemodynamic instability new onset chest pain, or abrupt deterioration in previously stable angina, with recurrent chest pain occurring frequently and with little or no exertion, and with episodes often lasting longer than 15 minutes."
      source: cg95

  cg95-emergency-referral-1.2.1.7:
    complaints: [chest-pain]
    all_of:
      - {var: chest_pain_duration, op: in, value: [over_15_minutes, constant]}
    min_matches: 1
    any_of:
      - {var: autonomic_symptoms, op: "==", value: present}
      - {var: chest_pain_radiation, op: "==", value: arm_jaw_or_neck}
      - {var: chest_pain_character, op: "==", value: constricting}
    emit:
      kind: escalation
      urgency: emergency
      text_verbatim: "Refer people to hospital as an emergency if an ACS is suspected (see recommendation 1.2.1.3) and: they currently have chest pain or they are currently pain free, but had chest pain in the last 12 hours, and a resting 12‑lead ECG is abnormal or not available."
      source: cg95

  cg95-same-day-1.2.1.8:
    complaints: [chest-pain]
    all_of:
      - {var: chest_pain_character, op: "==", value: constricting}
      - {var: chest_pain_duration, op: "==", value: under_15_minutes}
    emit:
      kind: referral
      urgency: same_day
      text_verbatim: "If an ACS is suspected (see recommendation 1.2.1.3) and there are no reasons for emergency referral, refer people for urgent same-day assessment if: they had chest pain in the last 12 hours, but are now pain free with a normal resting 12‑lead ECG or the last episode of pain was 12 to 72 hours ago."
      source: cg95

  cg95-angina-typicality-1.3.3.1:
    complaints: [chest-pain]
    min_matches: 2
    any_of:
      - {var: chest_pain_character, op: "==", value: constricting}
      - {var: chest_pain_trigger, op: "==", value: exertion}
      - {var: chest_pain_relief, op: "==", value: rest_or_gtn}
    emit:
      kind: must_ask
      urgency: urgent
      text_verbatim: "Assess the typicality of chest pain as follows: Presence of three of the features below is defined as typical angina. Presence of two of the three features below is defined as atypical angina. Presence of one or none of the features below is defined as non-anginal chest pain. Anginal pain is: constricting discomfort in the front of the chest, or in the neck, shoulders, jaw or arms precipitated by physical exertion relieved by rest or GTN within about 5 minutes."
      source: cg95

  ng158-pe-chest-pain-1.1.15:
    complaints: [chest-pain]
    min_matches: 1
    any_of:
      - {var: pleuritic_pain, op: "==", value: present}
      - {var: clinical_dvt_signs, op: "==", value: present}
      - {var: recent_immobility, op: "==", value: present}
    emit:
      kind: investigation
      urgency: same_day
      text_verbatim: "For people who present with signs or symptoms of PE, such as chest pain, shortness of breath or coughing up blood, assess their general medical history, do a physical examination and offer a chest X‑ray to exclude other causes. [2012]"
      source: ng158
