# Acute cough / breathlessness -- NICE rules.
#
# GENERATED by scripts/build_rules_acute_cough.py from .workbench/nice/.
# text_verbatim is sliced directly out of the fetched guideline text; do not
# hand-edit it. Re-run the builder instead.
#
# Rules are single-shot predicates over the answer set. They never chain and
# never write to the ranking -- they emit actions only.

sources:
  ng12:
    type: guideline
    title: "Suspected cancer: recognition and referral"
    url: https://www.nice.org.uk/guidance/ng12
    licence: https://www.nice.org.uk/reusing-our-content/nice-uk-open-content-licence
    attribution: "(c) NICE 2015 Suspected cancer: recognition and referral. Available from https://www.nice.org.uk/guidance/ng12 All rights reserved. Subject to Notice of rights."
  ng158:
    type: guideline
    title: "Venous thromboembolic diseases: diagnosis, management and thrombophilia testing"
    url: https://www.nice.org.uk/guidance/ng158
    licence: https://www.nice.org.uk/reusing-our-content/nice-uk-open-content-licence
    attribution: "(c) NICE 2020 Venous thromboembolic diseases: diagnosis, management and thrombophilia testing. Available from https://www.nice.org.uk/guidance/ng158 All rights reserved. Subject to Notice of rights."
  ng250:
    type: guideline
    title: "Pneumonia: diagnosis and management"
    url: https://www.nice.org.uk/guidance/ng250
    licence: https://www.nice.org.uk/reusing-our-content/nice-uk-open-content-licence
    attribution: "(c) NICE 2025 Pneumonia: diagnosis and management. Available from https://www.nice.org.uk/guidance/ng250 All rights reserved. Subject to Notice of rights."
    note: "Replaced CG191, which NICE withdrew on 31 October 2023."
  ng253:
    type: guideline
    title: "Suspected sepsis in people aged 16 or over"
    url: https://www.nice.org.uk/guidance/ng253
    licence: https://www.nice.org.uk/reusing-our-content/nice-uk-open-content-licence
    attribution: "(c) NICE 2024 Suspected sepsis in people aged 16 or over. Available from https://www.nice.org.uk/guidance/ng253 All rights reserved. Subject to Notice of rights."
    note: "Replaced NG51, which NICE split into NG253/NG254/NG255 on 19 March 2024."

variables:
  age_years:
    prompt: "How old is the patient?"
    modality: history
    cost: 0
    values: [under_40, forty_to_64, sixty_five_or_over, unknown]
  ever_smoked:
    prompt: "Has the patient ever smoked?"
    modality: history
    cost: 0
    values: [never, former, current, unknown]
  weight_loss:
    prompt: "Is there unexplained weight loss?"
    modality: history
    cost: 0
    values: [present, absent, unknown]
  appetite_loss:
    prompt: "Has the appetite dropped?"
    modality: history
    cost: 0
    values: [present, absent, unknown]
  fatigue:
    prompt: "Is the patient unusually tired?"
    modality: history
    cost: 0
    values: [present, absent, unknown]
  chest_pain_present:
    prompt: "Is there chest pain?"
    modality: history
    cost: 0
    values: [present, absent, unknown]
  finger_clubbing:
    prompt: "Is there finger clubbing?"
    modality: examination
    cost: 1
    values: [present, absent, unknown]
  confusion_new:
    prompt: "Is there new confusion?"
    hint: "Abbreviated Mental Test score 8 or less, or new disorientation in person, place or time"
    modality: examination
    cost: 1
    values: [present, absent, unknown]
  low_blood_pressure:
    prompt: "Is the blood pressure low?"
    hint: "Systolic under 90 mmHg, or diastolic 60 mmHg or less"
    modality: examination
    cost: 2
    values: [present, absent, unknown]
  clinical_dvt_signs:
    prompt: "Are there clinical signs of DVT?"
    hint: "Minimum of leg swelling and pain with palpation of the deep veins"
    modality: examination
    cost: 1
    values: [present, absent, unknown]
  heart_rate_over_100:
    prompt: "Is the heart rate over 100 beats per minute?"
    modality: examination
    cost: 1
    values: [present, absent, unknown]
  pe_alternative_less_likely:
    prompt: "Is an alternative diagnosis less likely than PE?"
    modality: history
    cost: 0
    values: [alternative_less_likely, alternative_at_least_as_likely, unknown]

rules:
  ng12-lung-1.1.1:
    complaints: [acute-cough]
    all_of:
      - {var: age_years, op: in, value: [forty_to_64, sixty_five_or_over]}
      - {var: cough_character, op: "==", value: blood_stained}
    emit:
      kind: referral
      urgency: urgent
      text_verbatim: "Refer people using a suspected cancer pathway referral for lung cancer if they: have chest X‑ray findings that suggest lung cancer, or are aged 40 and over with unexplained haemoptysis."
      source: ng12

  # NG12 1.1.2 has two limbs. Split so each is faithful: two-or-more symptoms
  # regardless of smoking, or ever-smoked plus one. Same verbatim text on both.
  ng12-lung-1.1.2-two-symptoms:
    complaints: [acute-cough]
    all_of:
      - {var: age_years, op: in, value: [forty_to_64, sixty_five_or_over]}
    min_matches: 2
    any_of:
      - {var: cough_duration, op: in, value: [three_to_8_weeks, over_8_weeks]}
      - {var: fatigue, op: "==", value: present}
      - {var: breathlessness, op: in, value: [on_exertion, at_rest]}
      - {var: chest_pain_present, op: "==", value: present}
      - {var: weight_loss, op: "==", value: present}
      - {var: appetite_loss, op: "==", value: present}
    emit:
      kind: investigation
      urgency: urgent
      text_verbatim: "Offer an urgent , direct access chest X‑ray to assess for lung cancer in people aged 40 and over if they have 2 or more of the following unexplained symptoms, or if they have ever smoked and have 1 or more of the following unexplained symptoms: cough fatigue shortness of breath chest pain weight loss appetite loss."
      source: ng12

  ng12-lung-1.1.2-smoker-one-symptom:
    complaints: [acute-cough]
    all_of:
      - {var: age_years, op: in, value: [forty_to_64, sixty_five_or_over]}
      - {var: ever_smoked, op: in, value: [former, current]}
    min_matches: 1
    any_of:
      - {var: cough_duration, op: in, value: [three_to_8_weeks, over_8_weeks]}
      - {var: fatigue, op: "==", value: present}
      - {var: breathlessness, op: in, value: [on_exertion, at_rest]}
      - {var: chest_pain_present, op: "==", value: present}
      - {var: weight_loss, op: "==", value: present}
      - {var: appetite_loss, op: "==", value: present}
    emit:
      kind: investigation
      urgency: urgent
      text_verbatim: "Offer an urgent , direct access chest X‑ray to assess for lung cancer in people aged 40 and over if they have 2 or more of the following unexplained symptoms, or if they have ever smoked and have 1 or more of the following unexplained symptoms: cough fatigue shortness of breath chest pain weight loss appetite loss."
      source: ng12

  ng12-lung-1.1.3:
    complaints: [acute-cough]
    all_of:
      - {var: age_years, op: in, value: [forty_to_64, sixty_five_or_over]}
    any_of:
      - {var: finger_clubbing, op: "==", value: present}
      - {var: cough_duration, op: "==", value: over_8_weeks}
    emit:
      kind: investigation
      urgency: urgent
      text_verbatim: "Consider an urgent , direct access chest X‑ray to assess for lung cancer in people aged 40 and over with any of the following: persistent or recurrent chest infection finger clubbing supraclavicular lymphadenopathy or persistent cervical lymphadenopathy chest signs consistent with lung cancer thrombocytosis."
      source: ng12

  ng158-pe-1.1.15:
    complaints: [acute-cough]
    any_of:
      - {var: cough_character, op: "==", value: blood_stained}
      - {var: pleuritic_pain, op: "==", value: present}
      - {var: breathlessness, op: "==", value: at_rest}
    emit:
      kind: investigation
      urgency: same_day
      text_verbatim: "For people who present with signs or symptoms of PE, such as chest pain, shortness of breath or coughing up blood, assess their general medical history, do a physical examination and offer a chest X‑ray to exclude other causes. [2012]"
      source: ng158

  ng158-pe-1.1.17:
    complaints: [acute-cough]
    any_of:
      - {var: clinical_dvt_signs, op: "==", value: present}
      - {var: pe_alternative_less_likely, op: "==", value: alternative_less_likely}
      - {var: heart_rate_over_100, op: "==", value: present}
      - {var: recent_immobility, op: "==", value: present}
    emit:
      kind: must_ask
      urgency: same_day
      text_verbatim: "If PE is suspected, use the 2‑level PE Wells score (table 2) to estimate the clinical probability of PE. [2012]"
      source: ng158

  ng250-cap-1.2.3:
    complaints: [acute-cough]
    any_of:
      - {var: confusion_new, op: "==", value: present}
      - {var: respiratory_rate, op: "==", value: thirty_or_over}
      - {var: low_blood_pressure, op: "==", value: present}
      - {var: age_years, op: "==", value: sixty_five_or_over}
    emit:
      kind: referral
      urgency: same_day
      text_verbatim: "Use clinical judgement together with the CRB65 score (bearing in mind this can be affected by other factors, for example, comorbidities or pregnancy) to inform shared decisions about place of care (see recommendation 1.2.11 for further details). Consider: referral to hospital for adults with a CRB65 score of 2 or more one of the following options for adults with a CRB65 score of 1: primary care-led services with safety netting advice or referral to: a virtual ward or same-day emergency care (SDEC) unit or hospital at home service or hospital primary care-led services with safety netting advice for adults with a CRB65 score of 0."
      source: ng250

  ng253-sepsis-1.5.2:
    complaints: [acute-cough]
    any_of:
      - {var: confusion_new, op: "==", value: present}
      - {var: respiratory_rate, op: "==", value: thirty_or_over}
      - {var: low_blood_pressure, op: "==", value: present}
      - {var: oxygen_saturation, op: "==", value: under_92}
    emit:
      kind: escalation
      urgency: emergency
      text_verbatim: "Recognise that people aged 16 or over with suspected sepsis in the community and in custodial settings are at: high risk of severe illness or death from sepsis if they meet any of the high-risk criteria in table 1 moderate to high risk of severe illness or death from sepsis if they meet any of the moderate- to high-risk criteria in table 1."
      source: ng253
