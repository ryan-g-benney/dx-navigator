conditions:
  pneumothorax:
    name: "Spontaneous pneumothorax"
    parents: [pleural]
    codes: {snomed: '80423007', icd10: J93.9}
    urgency: emergency
    red_flag_features: [pain_onset_abruptness, breathlessness]
    features:
      chest_pain_character:  {expect: [sharp_stabbing], source: gp-estimate}
      pain_onset_abruptness: {expect: [instant_maximal], source: gp-estimate}
      pleuritic_pain:        {expect: [present], source: gp-estimate}
      breathlessness:        {expect: [at_rest], source: gp-estimate}
      auscultation:          {expect: [reduced_air_entry], source: gp-estimate}
      reproducible_on_palpation: {expect: [absent], source: gp-estimate}
      fever_history:         {expect: [absent], source: gp-estimate}

  gastro-oesophageal-reflux:
    name: "Gastro-oesophageal reflux disease"
    parents: [oesophageal]
    codes: {snomed: '235595009', icd10: K21.9}
    urgency: routine
    features:
      chest_pain_character: {expect: [burning], source: gp-estimate}
      chest_pain_trigger:   {expect: [eating, posture_change], source: gp-estimate}
      chest_pain_relief:    {expect: [antacid], source: gp-estimate}
      chest_pain_radiation: {expect: [nowhere], source: gp-estimate}
      autonomic_symptoms:   {expect: [absent], source: gp-estimate}
      breathlessness:       {expect: [none], source: gp-estimate}

  oesophageal-spasm:
    name: "Oesophageal spasm"
    parents: [oesophageal]
    codes: {snomed: '79962008', icd10: K22.4}
    urgency: routine
    features:
      chest_pain_character: {expect: [constricting], source: gp-estimate}
      chest_pain_trigger:   {expect: [eating], source: gp-estimate}
      chest_pain_duration:  {expect: [under_15_minutes], source: gp-estimate}
      chest_pain_relief:    {expect: [rest_or_gtn, antacid], source: gp-estimate}
      autonomic_symptoms:   {expect: [absent], source: gp-estimate}

  costochondritis:
    name: "Costochondritis"
    parents: [chest-wall]
    codes: {snomed: '64109004', icd10: M94.0}
    urgency: routine
    features:
      chest_pain_character:      {expect: [sharp_stabbing, aching], source: gp-estimate}
      chest_pain_trigger:        {expect: [movement], source: gp-estimate}
      reproducible_on_palpation: {expect: [present], source: gp-estimate}
      chest_pain_radiation:      {expect: [nowhere], source: gp-estimate}
      autonomic_symptoms:        {expect: [absent], source: gp-estimate}
      breathlessness:            {expect: [none], source: gp-estimate}

  anxiety-related-chest-pain:
    name: "Anxiety-related chest pain"
    parents: [psychological]
    # No SNOMED code: no anxiety-specific chest pain concept; 274668005 Non-cardiac chest pain is
    # broader than this entry and would overstate the match
    codes: {icd10: F41.0}
    urgency: routine
    features:
      chest_pain_character:  {expect: [sharp_stabbing, aching], source: gp-estimate}
      chest_pain_duration:   {expect: [seconds, constant], source: gp-estimate}
      chest_pain_trigger:    {expect: [nothing_specific], source: gp-estimate}
      breathlessness:        {expect: [at_rest], source: gp-estimate}
      autonomic_symptoms:    {expect: [present], source: gp-estimate}
      pain_onset_abruptness: {expect: [built_over_minutes], source: gp-estimate}
      reproducible_on_palpation: {expect: [absent], source: gp-estimate}
